name: release

# Builds the Windows distribution and publishes it as a GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build, test and package
        run: mvn verify --batch-mode --no-transfer-progress
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(sed -n '0,/<version>/s:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml)
          VER="v${BASE}-build.${{ github.run_number }}"
          ASSET="aifi-pull-agent-dist_${VER}.zip"
          cp target/aifi-pull-agent-dist.zip "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release create "${VER}" "$ASSET" "$ASSET.sha256" \
            --target "${{ github.sha }}" \
            --title "AIFI Pull Agent ${VER}" \
            --notes "Windows distribution: unzip, run aifi-pull-agent.bat. Manual: docs/HANDLEIDING.md inside the zip."
